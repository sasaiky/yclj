<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>YCLJ 屏幕共享</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #111; color: #f4f4f4; font: 14px system-ui, sans-serif; }
    #screen-controls { padding: 8px 14px; text-align: right; background: #202020; }
    select { margin-left: 6px; padding: 4px; font: inherit; color-scheme: dark; }
    video { display: block; flex: 1; width: 100%; min-height: 0; object-fit: contain; }
  </style>
</head>
<body>
  <div id="screen-controls" hidden>
    <label for="screen-quality">画质</label>
    <select id="screen-quality">
      <option value="economy">省流 · 540p</option>
      <option value="standard" selected>标准 · 720p</option>
      <option value="clear">清晰 · 1080p</option>
    </select>
  </div>
  <video id="screen" aria-label="对方共享的屏幕" autoplay playsinline muted></video>
</body>
</html>
